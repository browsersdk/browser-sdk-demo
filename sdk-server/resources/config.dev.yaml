server:
  mode: dev         # 应用程序运行模式（dev开发环境、test测试环境、prod线上环境）
  host: 0.0.0.0     # 服务器IP地址，默认使用0.0.0.0
  name: dilu-plus      # 服务名称
  port: 7888       # 服务端口号
  node: 1
  #read-timeout    #读超时 单位秒 默认20
  #write-timeout   #写超时 单位秒 默认20
  fs-type: local    #文件服务
grpc-server:
  enable: false
  host: 0.0.0.0
  port: 7889
logger:             # 日志配置
  level: debug # 级别
  prefix:    # 日志前缀
  format:  # 输出格式 json
  director: temp      # 日志文件夹
  encode-level: LowercaseColorLevelEncoder # 编码级LowercaseLevelEncoder LowercaseColorLevelEncoder
  stacktrace-key: # 栈名
  #max-age: 7                         # 日志留存时间 默认7天
  show-line: true # 显示行
  log-in-console: true # 输出控制台
access-limit: #访问频率限制
  enable: false #是否访问限制
  duration: 5s #时长
  total: 300 #300次
jwt:                # JWT配置
  sign-key: 12e96bbf8e03035893ea92b7cf12c000   # Token密钥
  expires: 10080    # Token过期时长（单位：分钟）
  refresh: 14400    # Token 刷新时长（单位：分钟）
cache:              # 缓存配置
  type: memory #redis/memory
  addr: 127.0.0.1:6379    # Redis cluster模式以;隔开（redis本身必须是cluster模式），eg：localhost:6379;localhost:6380
  #password: redis             # Redis密码
  #db: 0                       # 设置 DB, 只针对 `Redis Client` 和 `Failover Client`
  master-name:  #不为空 Failover模式
dbcfg: # 数据库配置
  driver: sqlite  
  dns: dbs/dilu.db  # 数据库连接字符串
  log-mode: info #日志类型 GORM 定义了这些日志级别：silent、error、warn、info
  dbs:      
    - notice:    #子配置会继承父配置
        dns: dbs/notice.db  # 数据库连接字符串
cors:
  enable: true
  mode: allow-all
  #whitelist:
  #- allow-origin: example1.com
  #  allow-methods: POST, GET
  #  allow-headers: Content-Type,AccessToken,X-CSRF-Token, Authorization, Token,X-Token,X-User-Id
  #  expose-headers: Content-Length, Access-Control-Allow-Origin, Access-Control-Allow-Headers,
  #    Content-Type
  #  allow-credentials: true
gen: 
  enable: true #开启生成
  front-path: ../sdk-admin/src #前端生成路径 默认：../dilu-admin/src
extend:             # 扩展项（此处没有提供具体说明）
  bro-sdk:
    endpoint: http://192.168.0.188:9988
    api-key: Ls/e7BzPbtHfcmfR3V+kYJpWHsPffdXKWhEYJdABTmYp+CV/FA1G7EHzk6coamX5

    